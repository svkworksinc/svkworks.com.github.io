<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — SVK Works</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/svk-icon.png" type="image/png">
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <section class="section" style="min-height:70vh;display:flex;align-items:center;">
      <div class="container">
        <div style="max-width:560px;margin:0 auto;text-align:center;" class="fade-in">
          <div style="font-size:6rem;font-weight:800;color:var(--magenta);line-height:1;margin-bottom:var(--space-lg);">404</div>
          <h1 style="margin-bottom:var(--space-md);">Page Not Found</h1>
          <p style="color:var(--text-secondary);margin-bottom:var(--space-3xl);">
            Looks like this wire isn't connected. The page you're looking for doesn't exist or may have been moved.
          </p>
          <div style="display:flex;gap:var(--space-md);justify-content:center;flex-wrap:wrap;">
            <a href="/" class="btn btn-primary btn-lg">Back to Home</a>
            <a href="/harnesses.html" class="btn btn-outline btn-lg">Browse Harnesses</a>
            <a href="/contact.html" class="btn btn-ghost btn-lg">Contact Us</a>
          </div>
          <div style="margin-top:var(--space-3xl);padding-top:var(--space-2xl);border-top:1px solid var(--border-color);">
            <p style="font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-lg);">Looking for something specific?</p>
            <div style="display:flex;gap:var(--space-md);justify-content:center;flex-wrap:wrap;font-size:var(--text-sm);">
              <a href="/mk4-supra.html" style="color:var(--magenta);">MK4 Supra</a>
              <a href="/mk3-supra.html" style="color:var(--magenta);">MK3 Supra</a>
              <a href="/sc300.html" style="color:var(--magenta);">SC300/SC400</a>
              <a href="/builds.html" style="color:var(--magenta);">Builds</a>
              <a href="/resources.html" style="color:var(--magenta);">Resources</a>
              <a href="/support.html" style="color:var(--magenta);">Support</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="/components/header.js"></script>
  <script defer src="/components/footer.js"></script>
  <script defer src="/js/cart.js?v=3"></script>
  <script defer src="/js/components.js"></script>
  <script defer src="/data/products-data.js"></script>
  <script defer src="/js/products.js"></script>
  <script defer src="/js/search.js"></script>
  <script defer src="/js/main.js"></script>
  <script>
    (function () {
      var redirects = {
        '/wiringharnesses/sc300-sc400.html': '/sc300.html',
        '/wiringharnesses/race-spec-harness.html': '/harnesses.html',
        '/wiringharnesses/supra-mk4-2jz-harness.html': '/mk4-supra.html',
        '/wiringharnesses/supra-mk3-harness.html': '/mk3-supra.html',
        '/wiringharnesses/': '/harnesses.html',
        '/wiringharnesses': '/harnesses.html',
        '/resources/resources.html': '/resources.html',
        '/references/references.html': '/resources.html',
        '/services/services.html': '/services.html',
        '/3dparts/3d-parts.html': '/3d-parts.html',
        '/3dparts/supra-cup-holder': '/mk4-supra-cupholder.html',
        '/3dparts/': '/3d-parts.html',
        '/3dparts': '/3d-parts.html',
        '/index.html': '/',
      };
      var path = window.location.pathname;
      if (redirects[path]) {
        window.location.replace(redirects[path]);
        return;
      }
      // Generic fallback: /any-dir/page.html → /page.html
      var m = path.match(/^\/[^/]+\/([^/]+\.html)$/);
      if (m) {
        window.location.replace('/' + m[1]);
      }
    })();
  </script>
</body>
</html>
