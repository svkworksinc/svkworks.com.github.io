<script>
const BASE_PRICE = 1200;
const options = document.querySelectorAll(".price-option");
const totalDisplay = document.getElementById("total");

function calculateTotal() {
  let total = BASE_PRICE;
  options.forEach(o => total += parseInt(o.value) || 0);
  totalDisplay.textContent = total;
}

options.forEach(o => o.addEventListener("change", calculateTotal));
calculateTotal();

function emailOrder() {
  const name = document.getElementById("customer-name").value || "Not provided";
  const email = document.getElementById("customer-email").value;
  const notes = document.getElementById("customer-notes").value || "None";

  if (!email.includes("@")) {
    alert("Please enter a valid email so I can reply.");
    return;
  }

  let body = `SVK Harness Build Request\n\nBase Price: $${BASE_PRICE}\n\nSelections:\n`;

  options.forEach(o => {
    const label = o.previousElementSibling.textContent;
    const text = o.options[o.selectedIndex].text;
    body += `- ${label}: ${text}\n`;
  });

  body += `\nEstimated Total: $${totalDisplay.textContent}\n\n`;
  body += `Customer:\nName: ${name}\nEmail: ${email}\nNotes: ${notes}`;

  const mailto = `mailto:info@svkworks.com?subject=SVK Harness Build Request&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

function toggleMenu() {
  document.getElementById("nav-links").classList.toggle("active");
}
</script>
<script>
let currentSlide = 0;
const slides = document.querySelectorAll(".image-slider img");

function changeSlide(direction) {
  slides[currentSlide].classList.remove("active");
  currentSlide = (currentSlide + direction + slides.length) % slides.length;
  slides[currentSlide].classList.add("active");
}
</script>
