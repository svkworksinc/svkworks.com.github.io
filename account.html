<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | SVK Works</title>
  <meta name="description" content="Manage your SVK Works account, view your harness build orders, and update your profile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <!-- Account hero -->
    <section class="section" style="background:var(--bg-secondary);padding-bottom:var(--space-2xl);">
      <div class="container">
        <div class="account-hero">
          <div class="account-avatar" id="account-avatar">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div>
            <h1 id="account-greeting" style="font-size:var(--text-3xl);margin:0;">My Account</h1>
            <p id="account-email" style="color:var(--text-secondary);margin:var(--space-xs) 0 0;"></p>
          </div>
          <button class="btn btn-ghost" id="signout-btn" onclick="handleSignOut()" style="margin-left:auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </div>
    </section>

    <!-- Orders Section -->
    <section class="section">
      <div class="container">
        <div class="account-layout">

          <!-- Left: Orders -->
          <div class="account-main">
            <div class="account-section-header">
              <h2>Build Requests</h2>
              <span class="section-label" id="order-count-badge"></span>
            </div>

            <div id="orders-loading" class="account-empty">
              <div class="account-empty-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <p>Loading your orders…</p>
            </div>

            <div id="orders-empty" class="account-empty" style="display:none;">
              <div class="account-empty-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              </div>
              <p>No build requests yet.</p>
              <a href="harnesses.html" class="btn btn-primary" style="margin-top:var(--space-lg);">Browse Harnesses</a>
            </div>

            <div id="orders-list" style="display:none; display:flex; flex-direction:column; gap:var(--space-md);"></div>
          </div>

          <!-- Right: Profile -->
          <div class="account-sidebar">
            <div class="account-card">
              <h3>Profile</h3>
              <form id="profile-form" onsubmit="handleProfileSave(event)">
                <div class="form-group">
                  <label class="form-label" for="profile-name">Full Name</label>
                  <input type="text" class="form-input" id="profile-name" placeholder="Your name" autocomplete="name">
                </div>
                <div class="form-group">
                  <label class="form-label" for="profile-phone">Phone <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                  <input type="tel" class="form-input" id="profile-phone" placeholder="+1 (555) 000-0000" autocomplete="tel">
                </div>
                <div id="profile-success" class="auth-success" style="display:none;">Profile saved.</div>
                <button type="submit" class="btn btn-outline" style="width:100%;" id="profile-save-btn">Save Profile</button>
              </form>
            </div>

            <div class="account-card">
              <h3>Quick Links</h3>
              <ul class="account-links">
                <li><a href="harnesses.html">Browse Harnesses</a></li>
                <li><a href="services.html">Our Services</a></li>
                <li><a href="support.html">Support &amp; FAQ</a></li>
                <li><a href="contact.html">Contact Us</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js"></script>
  <script defer src="components/footer.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/main.js"></script>
  <script>
    const STATUS_LABELS = {
      pending:     { label: 'Pending Review',  cls: 'status-pending'  },
      in_progress: { label: 'In Progress',     cls: 'status-progress' },
      complete:    { label: 'Complete',         cls: 'status-complete' },
      shipped:     { label: 'Shipped',          cls: 'status-shipped'  },
      cancelled:   { label: 'Cancelled',        cls: 'status-cancelled'},
    };

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
    }

    function formatPrice(cents) {
      return '$' + Number(cents).toLocaleString();
    }

    function renderOptions(opts) {
      if (!opts || typeof opts !== 'object') return '';
      return Object.entries(opts)
        .filter(([, v]) => v && v !== 'Select' && !String(v).startsWith('Select'))
        .map(([k, v]) => `<li><span class="opt-key">${k}:</span> ${v}</li>`)
        .join('');
    }

    function renderOrder(order) {
      const s = STATUS_LABELS[order.status] || STATUS_LABELS.pending;
      const optLines = renderOptions(order.options);
      return `
        <div class="order-card">
          <div class="order-card-header">
            <div>
              <div class="order-product">${order.product}</div>
              <div class="order-date">${formatDate(order.submitted_at)}</div>
            </div>
            <div class="order-card-right">
              <span class="order-status ${s.cls}">${s.label}</span>
              <span class="order-total">${formatPrice(order.total_price)}</span>
            </div>
          </div>
          ${optLines ? `<details class="order-options-details"><summary>View Options</summary><ul class="order-options-list">${optLines}</ul></details>` : ''}
          ${order.notes ? `<p class="order-notes"><strong>Notes:</strong> ${order.notes}</p>` : ''}
        </div>`;
    }

    async function handleSignOut() {
      await SVKAuth.ready;
      await SVKAuth.signOut();
      window.location.href = 'index.html';
    }

    async function handleProfileSave(e) {
      e.preventDefault();
      const btn = document.getElementById('profile-save-btn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      await SVKAuth.updateProfile({
        full_name: document.getElementById('profile-name').value.trim(),
        phone: document.getElementById('profile-phone').value.trim(),
      });
      const el = document.getElementById('profile-success');
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
      btn.disabled = false;
      btn.textContent = 'Save Profile';
    }

    async function initPage() {
      await SVKAuth.ready;

      if (!SVKAuth.configured) {
        window.location.href = 'index.html';
        return;
      }

      const session = await SVKAuth.getSession();
      if (!session) {
        window.location.href = 'login.html?return=account.html';
        return;
      }

      // Populate header
      const user = session.user;
      const profile = await SVKAuth.getProfile();
      const name = profile?.full_name || user.email.split('@')[0];
      document.getElementById('account-greeting').textContent = 'Hi, ' + name;
      document.getElementById('account-email').textContent = user.email;
      document.getElementById('account-avatar').textContent = name[0].toUpperCase();
      document.getElementById('account-avatar').style.fontSize = '1.5rem';

      // Populate profile form
      if (profile?.full_name) document.getElementById('profile-name').value = profile.full_name;
      if (profile?.phone)     document.getElementById('profile-phone').value = profile.phone;

      // Load orders
      const orders = await SVKAuth.getOrders();
      document.getElementById('orders-loading').style.display = 'none';

      if (orders.length === 0) {
        document.getElementById('orders-empty').style.display = 'flex';
      } else {
        const list = document.getElementById('orders-list');
        list.style.display = 'flex';
        list.innerHTML = orders.map(renderOrder).join('');
        document.getElementById('order-count-badge').textContent =
          orders.length + (orders.length === 1 ? ' order' : ' orders');
      }
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
