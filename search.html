<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — SVK Works</title>
  <meta name="description" content="Search SVK Works products, resources, and blog posts.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://svkworks.com/search.html">
  <meta property="og:site_name" content="SVK Works">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Search — SVK Works">
  <meta property="og:description" content="Search SVK Works products, resources, and blog posts.">
  <meta property="og:url" content="https://svkworks.com/search.html">
  <meta property="og:image" content="https://svkworks.com/img/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Search — SVK Works">
  <meta name="twitter:description" content="Search SVK Works products, resources, and blog posts.">
  <meta name="twitter:image" content="https://svkworks.com/img/og-default.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="page-hero">
      <div class="container">
        <h1>Search</h1>
        <form class="search-form" id="page-search-form" style="margin-top:var(--space-lg);max-width:600px;">
          <input type="text" class="search-input" id="page-search-input" placeholder="Search products, harnesses, resources..." autofocus>
          <button type="submit" class="search-submit" aria-label="Search">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </form>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div id="search-results"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js"></script>
  <script defer src="components/footer.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="data/products-data.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await SVKProducts.load();

      const params = new URLSearchParams(window.location.search);
      const query = params.get('q') || '';
      const input = document.getElementById('page-search-input');
      const form = document.getElementById('page-search-form');

      if (query) {
        input.value = query;
        const results = await SVKSearch.performSearch(query);
        SVKSearch.renderSearchResults(results, query);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        history.replaceState(null, '', `search.html?q=${encodeURIComponent(q)}`);
        const results = await SVKSearch.performSearch(q);
        SVKSearch.renderSearchResults(results, q);
      });

      // Live search as user types (debounced)
      let searchTimeout;
      input.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
          const q = input.value.trim();
          if (!q) {
            document.getElementById('search-results').innerHTML = '';
            history.replaceState(null, '', 'search.html');
            return;
          }
          history.replaceState(null, '', `search.html?q=${encodeURIComponent(q)}`);
          const results = await SVKSearch.performSearch(q);
          SVKSearch.renderSearchResults(results, q);
        }, 300);
      });
    });
  </script>
</body>
</html>
