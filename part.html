<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part — SVK Works</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/svk-icon.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <div id="part-loading" class="section" style="text-align:center;">
      <div class="container">
        <div class="spinner" style="margin:4rem auto;"></div>
        <p class="text-secondary">Loading part…</p>
      </div>
    </div>

    <div id="part-not-found" style="display:none;">
      <div class="page-hero">
        <div class="container">
          <h1>Part Not Found</h1>
          <p>This listing may have been removed. <a href="other-parts.html">Browse parts</a>.</p>
        </div>
      </div>
    </div>

    <div id="part-content" style="display:none;">
      <div class="page-hero">
        <div class="container">
          <div class="breadcrumb" role="navigation" aria-label="breadcrumb">
            <a href="index.html">Home</a><span class="breadcrumb-sep" aria-hidden="true">/</span>
            <a href="other-parts.html" id="part-breadcrumb-cat">—</a><span class="breadcrumb-sep" aria-hidden="true">/</span>
            <span id="part-breadcrumb-title">—</span>
          </div>
        </div>
      </div>

      <section class="product-detail">
        <div class="container">
          <div class="product-detail-layout">
            <div class="product-gallery">
              <div class="product-gallery-main" id="gallery-main">
                <img src="" alt="" id="part-main-image" loading="lazy">
              </div>
              <div class="product-gallery-thumbs" id="gallery-thumbs"></div>
            </div>

            <div class="product-info fade-in-right">
              <h1 id="part-title">—</h1>
              <div style="margin:var(--space-md) 0;" id="part-status-badge"></div>
              <div class="product-price-block">
                <span class="product-price-current" id="part-price">—</span>
              </div>

              <p class="product-description" id="part-description"></p>

              <div style="display:flex;gap:var(--space-md);flex-wrap:wrap;margin-top:var(--space-lg);">
                <button class="btn btn-primary" id="add-to-cart-btn" style="flex:1;min-width:180px;">
                  Add to Cart
                </button>
                <a href="other-parts.html" class="btn btn-secondary" id="back-link" style="flex:1;min-width:180px;">
                  ← Back
                </a>
              </div>

              <p style="font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-md);">
                Questions about fitment or specs? <a href="contact.html">Contact us</a> before you buy.
              </p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js"></script>
  <script defer src="components/footer.js"></script>
  <script defer src="js/cart.js?v=4"></script>
  <script defer src="js/components.js"></script>
  <script defer src="data/products-data.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/parts-catalog.js"></script>
  <script>
    const partId = new URLSearchParams(window.location.search).get('id');
    document.addEventListener('DOMContentLoaded', () => {
      initPartDetail(() => SVKAuth.getPartCatalogItem(partId));
    });
  </script>
</body>
</html>
