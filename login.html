<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Create Account | SVK Works</title>
  <meta name="description" content="Sign in to your SVK Works account to track your harness orders and build requests.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.svkworks.com/login.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/svk-icon.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/auth.js?v=63c00c7d"></script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <section class="section" style="min-height: calc(100vh - var(--header-height) - var(--header-top-height) - 200px); display:flex; align-items:center;">
      <div class="container">
        <div class="auth-wrap">
          <div class="auth-card">
            <div class="auth-logo">
              <img width="400" height="139" src="img/svk-logo.png" alt="SVK Works" style="height:40px;" loading="lazy">
            </div>

            <!-- Tab switcher -->
            <div class="auth-tabs">
              <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
              <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Sign In form -->
            <form id="form-signin" class="auth-form" onsubmit="handleSignIn(event)">
              <div class="form-group">
                <label class="form-label" for="signin-email">Email</label>
                <input type="email" class="form-input" id="signin-email" placeholder="your@email.com" required autocomplete="email">
              </div>
              <div class="form-group">
                <label class="form-label" for="signin-password">Password</label>
                <input type="password" class="form-input" id="signin-password" placeholder="••••••••" required autocomplete="current-password">
              </div>
              <div id="signin-error" class="auth-error" style="display:none;"></div>
              <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="signin-btn">
                Sign In
              </button>
              <p style="text-align:center;margin-top:var(--space-md);font-size:var(--text-sm);">
                <a href="#" onclick="showResetForm()" class="auth-link">Forgot your password?</a>
              </p>
            </form>

            <!-- Create Account form -->
            <form id="form-signup" class="auth-form" style="display:none;" onsubmit="handleSignUp(event)">
              <div class="form-group">
                <label class="form-label" for="signup-name">Your Name</label>
                <input type="text" class="form-input" id="signup-name" placeholder="First Last" required autocomplete="name">
              </div>
              <div class="form-group">
                <label class="form-label" for="signup-email">Email</label>
                <input type="email" class="form-input" id="signup-email" placeholder="your@email.com" required autocomplete="email">
              </div>
              <div class="form-group">
                <label class="form-label" for="signup-password">Password <span style="color:var(--text-muted);font-weight:400;">(min. 8 characters)</span></label>
                <input type="password" class="form-input" id="signup-password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
              </div>
              <div id="signup-error" class="auth-error" style="display:none;"></div>
              <div id="signup-success" class="auth-success" style="display:none;"></div>
              <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="signup-btn">
                Create Account
              </button>
            </form>

            <!-- Password Reset form -->
            <form id="form-reset" class="auth-form" style="display:none;" onsubmit="handleReset(event)">
              <p style="color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--space-lg);">Enter your email and we'll send you a link to reset your password.</p>
              <div class="form-group">
                <label class="form-label" for="reset-email">Email</label>
                <input type="email" class="form-input" id="reset-email" placeholder="your@email.com" required autocomplete="email">
              </div>
              <div id="reset-error" class="auth-error" style="display:none;"></div>
              <div id="reset-success" class="auth-success" style="display:none;"></div>
              <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="reset-btn">
                Send Reset Link
              </button>
              <p style="text-align:center;margin-top:var(--space-md);font-size:var(--text-sm);">
                <a href="#" onclick="switchTab('signin')" class="auth-link">Back to Sign In</a>
              </p>
            </form>

            <div id="auth-unconfigured" class="auth-notice" style="display:none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Accounts are not yet enabled. Check back soon or <a href="contact.html">contact us</a> directly.
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js?v=d4535b34"></script>
  <script defer src="components/footer.js?v=21590f2c"></script>
  <script defer src="js/cart.js?v=8cff9968"></script>
  <script defer src="js/components.js?v=2f6f4c57"></script>
  <script defer src="js/main.js?v=1bf74b49"></script>
  <script>
    SVKAuth.init();

    function switchTab(tab) {
      const isSignin = tab === 'signin';
      document.getElementById('tab-signin').classList.toggle('active', isSignin);
      document.getElementById('tab-signup').classList.toggle('active', !isSignin);
      document.getElementById('form-signin').style.display = isSignin ? '' : 'none';
      document.getElementById('form-signup').style.display = isSignin ? 'none' : '';
      document.getElementById('form-reset').style.display = 'none';
    }

    function showResetForm() {
      document.getElementById('form-signin').style.display = 'none';
      document.getElementById('form-signup').style.display = 'none';
      document.getElementById('form-reset').style.display = '';
      document.getElementById('tab-signin').classList.remove('active');
      document.getElementById('tab-signup').classList.remove('active');
    }

    function setLoading(btnId, loading, label) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="btn-spinner" aria-hidden="true"></span>Please wait…'
        : label;
    }

    function showSuccessState(btnId, label) {
      const btn = document.getElementById(btnId);
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-check" aria-hidden="true">✓</span>' + label;
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Supabase doesn't always return a clean, human-readable message (e.g. a
    // failed database trigger can come back as a bare "{}"). Fall back to a
    // generic message rather than showing that raw text, and log the real
    // error to the console so it can be diagnosed from there.
    function friendlyError(context, error) {
      console.error(context, error);
      const msg = error && typeof error.message === 'string' ? error.message.trim() : '';
      if (!msg || msg === '{}' || msg.toLowerCase() === 'null' || msg.toLowerCase() === 'undefined') {
        return 'Something went wrong. Please try again — if it keeps happening, contact us.';
      }
      return msg;
    }

    // Redirect destination — go back to wherever they came from
    const returnTo = new URLSearchParams(window.location.search).get('return') || 'account.html';

    async function handleSignIn(e) {
      e.preventDefault();
      hideError('signin-error');
      setLoading('signin-btn', true, 'Sign In');
      await SVKAuth.ready;

      if (!SVKAuth.configured) {
        document.getElementById('auth-unconfigured').style.display = 'flex';
        document.getElementById('form-signin').style.display = 'none';
        setLoading('signin-btn', false, 'Sign In');
        return;
      }

      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const { error } = await SVKAuth.signIn(email, password);

      if (error) {
        showError('signin-error', friendlyError('Sign-in error:', error));
        setLoading('signin-btn', false, 'Sign In');
      } else {
        showSuccessState('signin-btn', 'Signed in!');
        setTimeout(() => { window.location.href = returnTo; }, 500);
      }
    }

    async function handleSignUp(e) {
      e.preventDefault();
      hideError('signup-error');
      document.getElementById('signup-success').style.display = 'none';
      setLoading('signup-btn', true, 'Create Account');
      await SVKAuth.ready;

      if (!SVKAuth.configured) {
        document.getElementById('auth-unconfigured').style.display = 'flex';
        document.getElementById('form-signup').style.display = 'none';
        setLoading('signup-btn', false, 'Create Account');
        return;
      }

      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const { data, error } = await SVKAuth.signUp(email, password, name);

      if (error) {
        showError('signup-error', friendlyError('Sign-up error:', error));
        setLoading('signup-btn', false, 'Create Account');
      } else if (data?.session) {
        // Auto-confirmed (email confirmation disabled)
        showSuccessState('signup-btn', 'Account created!');
        setTimeout(() => { window.location.href = returnTo; }, 800);
      } else if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        // Supabase doesn't error here on purpose (prevents attackers from using
        // signup to discover which emails are registered) — it silently
        // returns a "fake" user for an email that's already taken instead.
        showError('signup-error', 'An account with that email already exists. Try signing in instead.');
        setLoading('signup-btn', false, 'Create Account');
      } else {
        // Email confirmation required
        const el = document.getElementById('signup-success');
        el.textContent = 'Check your email to confirm your account, then sign in.';
        el.style.display = 'block';
        setLoading('signup-btn', false, 'Create Account');
        switchTab('signin');
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      hideError('reset-error');
      document.getElementById('reset-success').style.display = 'none';
      setLoading('reset-btn', true, 'Send Reset Link');
      await SVKAuth.ready;

      const email = document.getElementById('reset-email').value;
      const { error } = await SVKAuth.resetPassword(email);

      if (error) {
        showError('reset-error', friendlyError('Password-reset error:', error));
      } else {
        const el = document.getElementById('reset-success');
        el.textContent = 'Reset link sent — check your email.';
        el.style.display = 'block';
      }
      setLoading('reset-btn', false, 'Send Reset Link');
    }

    // If already signed in, go straight to account
    document.addEventListener('DOMContentLoaded', async () => {
      await SVKAuth.ready;
      if (!SVKAuth.configured) return;
      const session = await SVKAuth.getSession();
      if (session) window.location.href = 'account.html';
    });
  </script>
</body>
</html>
