<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Parts &amp; Accessories — SVK Works</title>
  <meta name="description" content="Custom 3D printed interior and exterior accessories for MK4 Supra and other JDM platforms by SVK Works.">
  <link rel="canonical" href="https://www.svkworks.com/3d-parts.html">
  <meta property="og:site_name" content="SVK Works">
  <meta property="og:type" content="website">
  <meta property="og:title" content="3D Parts &amp; Accessories — SVK Works">
  <meta property="og:description" content="Custom 3D printed interior and exterior accessories for MK4 Supra and other JDM platforms by SVK Works.">
  <meta property="og:url" content="https://www.svkworks.com/3d-parts.html">
  <meta property="og:image" content="https://www.svkworks.com/img/svk-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="3D Parts &amp; Accessories — SVK Works">
  <meta name="twitter:description" content="Custom 3D printed interior and exterior accessories for MK4 Supra and other JDM platforms by SVK Works.">
  <meta name="twitter:image" content="https://www.svkworks.com/img/svk-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/svk-icon.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.svkworks.com/" },
      { "@type": "ListItem", "position": 2, "name": "3D Parts", "item": "https://www.svkworks.com/3d-parts.html" }
    ]
  }
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <div class="page-hero">
      <div class="container">
        <div class="breadcrumb" role="navigation" aria-label="breadcrumb">
          <a href="index.html">Home</a><span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span>3D Parts</span>
        </div>
        <h1>3D Parts &amp; Accessories</h1>
        <p>Custom 3D printed interior and exterior accessories, designed and printed in-house at SVK Works. Built to fit, built to last.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <div class="filter-tabs" id="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="mk4-supra">MK4 Supra</button>
          </div>
          <div class="filter-sort">
            <label for="sort-select">Sort:</label>
            <select id="sort-select">
              <option value="default">Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name">Name: A-Z</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </section>

    <!-- Admin-added 3D Parts (Supabase-managed) — hidden entirely if empty -->
    <section class="section" id="more-parts-section" style="display:none;padding-top:0;">
      <div class="container">
        <h2 style="font-size:var(--text-2xl);margin-bottom:var(--space-lg);">More 3D Parts</h2>
        <div class="product-grid" id="more-parts-grid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js?v=d4535b34"></script>
  <script defer src="components/footer.js?v=c7479f8d"></script>
  <script defer src="js/cart.js?v=8cff9968"></script>
  <script defer src="js/components.js?v=95134280"></script>
  <script defer src="data/products-data.js?v=3b913be2"></script>
  <script defer src="js/products.js?v=a112a74f"></script>
  <script defer src="js/search.js?v=adfac764"></script>
  <script defer src="js/main.js?v=999bf9e4"></script>
  <script src="js/auth.js?v=38e1ddbe"></script>
  <script src="js/parts-catalog.js?v=8ac0cf30"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await SVKProducts.load();
      let tagFilter = 'all';
      let currentSort = 'default';

      function render() {
        const filter = { category: '3d-parts' };
        if (tagFilter !== 'all') filter.tags = [tagFilter];
        if (currentSort !== 'default') filter.sort = currentSort;
        SVKProducts.renderProductGrid(SVKProducts.getProducts(filter), 'product-grid');
      }

      document.querySelectorAll('#filter-tabs .filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#filter-tabs .filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          tagFilter = tab.dataset.filter;
          render();
        });
      });

      document.getElementById('sort-select').addEventListener('change', (e) => {
        currentSort = e.target.value;
        render();
      });

      render();

      // Admin-added items (Supabase) — shown below the curated grid above.
      SVKAuth.init();
      await SVKAuth.ready;
      const moreParts = await SVKAuth.getPartsCatalog('3d-parts');
      if (moreParts.length) {
        document.getElementById('more-parts-section').style.display = 'block';
        document.getElementById('more-parts-grid').innerHTML = moreParts.map(part => {
          const img = (part.images && part.images[0]) || 'img/filler.webp';
          const url = svkCatalogPartUrl(part);
          const priceOrBadge = part.status === 'available'
            ? `<span class="product-card-price">${svkFormatCatalogPrice(part.price)}</span>`
            : `<span class="product-card-price" style="color:var(--text-muted);">Coming Soon</span>`;
          return `
          <div class="product-card fade-in">
            <div class="product-card-image">
              <img src="${img}" alt="${part.title}" loading="lazy">
              ${part.status !== 'available' ? '<span class="product-card-badge badge">Coming Soon</span>' : ''}
            </div>
            <div class="product-card-body">
              <h3 class="product-card-title"><a href="${url}">${part.title}</a></h3>
              <p class="product-card-desc">${(part.description || '').slice(0, 110)}${(part.description || '').length > 110 ? '…' : ''}</p>
              <div class="product-card-footer">
                ${priceOrBadge}
                <a href="${url}" class="btn btn-primary btn-sm">View</a>
              </div>
            </div>
          </div>`;
        }).join('');
        if (typeof SVKMain !== 'undefined') SVKMain.observeAnimations();
      }
    });
  </script>
</body>
</html>
