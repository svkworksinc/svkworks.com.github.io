<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — SVK Works</title>
  <meta name="description" content="Custom standalone wiring harness by SVK Works.">
  <link rel="canonical" href="https://www.svkworks.com/product.html">
  <meta property="og:site_name" content="SVK Works">
  <meta property="og:type" content="product">
  <meta property="og:title" content="Product — SVK Works">
  <meta property="og:description" content="Custom standalone wiring harness by SVK Works.">
  <meta property="og:url" content="https://www.svkworks.com/product.html">
  <meta property="og:image" content="https://www.svkworks.com/img/svk-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Product — SVK Works">
  <meta name="twitter:description" content="Custom standalone wiring harness by SVK Works.">
  <meta name="twitter:image" content="https://www.svkworks.com/img/svk-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/svk-icon.png" type="image/png">
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="product-detail-content">
    <div class="section">
      <div class="container text-center">
        <div class="spinner" style="margin:4rem auto;"></div>
        <p class="text-secondary">Loading product...</p>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js"></script>
  <script defer src="components/footer.js"></script>
  <script defer src="js/cart.js?v=3"></script>
  <script defer src="js/components.js"></script>
  <script defer src="data/products-data.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await SVKProducts.load();
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');
      if (productId) {
        SVKProducts.renderProductDetail(productId);
      } else {
        document.getElementById('product-detail-content').innerHTML = `
          <div class="page-hero">
            <div class="container">
              <h1>Product Not Found</h1>
              <p>The product you're looking for doesn't exist. <a href="harnesses.html">Browse our catalog</a>.</p>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
