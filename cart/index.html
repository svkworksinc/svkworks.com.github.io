<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — SVK Works</title>
  <meta name="description" content="Review your cart and proceed to checkout.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.svkworks.com/cart/">
  <meta property="og:site_name" content="SVK Works">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shopping Cart — SVK Works">
  <meta property="og:description" content="Review your cart and proceed to checkout.">
  <meta property="og:url" content="https://www.svkworks.com/cart/">
  <meta property="og:image" content="https://www.svkworks.com/img/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shopping Cart — SVK Works">
  <meta name="twitter:description" content="Review your cart and proceed to checkout.">
  <meta name="twitter:image" content="https://www.svkworks.com/img/og-default.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.svkworks.com/" },
      { "@type": "ListItem", "position": 2, "name": "Cart", "item": "https://www.svkworks.com/cart/" }
    ]
  }
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="page-hero">
      <div class="container">
        <div class="breadcrumb">
          <a href="/">Home</a><span class="breadcrumb-sep">/</span>
          <span>Cart</span>
        </div>
        <h1>Shopping Cart</h1>
      </div>
    </div>

    <section class="cart-page">
      <div class="container">
        <!-- Empty state -->
        <div id="cart-empty" class="empty-state" style="display:none;">
          <div class="empty-state-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          </div>
          <h3>Your cart is empty</h3>
          <p>Looks like you haven't added any harnesses yet.</p>
          <a href="/products/" class="btn btn-primary">Browse Harnesses</a>
        </div>

        <!-- Cart content -->
        <div id="cart-content" class="cart-layout" style="display:none;">
          <div>
            <div class="cart-items" id="cart-items"></div>
          </div>
          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div id="cart-summary-content"></div>
            <button class="btn btn-primary btn-lg" onclick="SVKCart.showToast('Checkout coming soon! For now, please contact us to place your order.'); ">
              Proceed to Checkout
            </button>
            <p class="cart-note">Shipping calculated at checkout. All harnesses are made to order.</p>
            <div class="promo-form">
              <input type="text" placeholder="Promo code">
              <button class="btn btn-sm btn-outline" onclick="SVKCart.showToast('Promo codes coming soon!');">Apply</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="/components/header.js"></script>
  <script defer src="/components/footer.js"></script>
  <script defer src="/js/cart.js"></script>
  <script defer src="/js/components.js"></script>
  <script defer src="/data/products-data.js"></script>
  <script defer src="/js/products.js"></script>
  <script defer src="/js/search.js"></script>
  <script defer src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SVKCart.renderCartPage();
    });
  </script>
</body>
</html>
