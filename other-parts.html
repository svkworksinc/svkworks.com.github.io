<head>
  <meta charset="UTF-8">

  <meta property="og:url" content="https://www.svkworks.com/other-parts.html">
  <meta property="og:image" content="https://www.svkworks.com/img/og-default.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.svkworks.com/" },
      { "@type": "ListItem", "position": 2, "name": "Other Parts", "item": "https://www.svkworks.com/other-parts.html" }

  }

</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <div class="page-hero">
      <div class="container">
        <div class="breadcrumb" role="navigation" aria-label="breadcrumb">
          <a href="index.html">Home</a><span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span>Other Parts</span>
        </div>
        <h1>Other Parts &amp; Harnesses</h1>
        <p>Lexus SC400/SC300, Honda K-series, universal swap harnesses, connector kits, and accessories.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <div class="filter-tabs" id="engine-filter">
            <button class="filter-tab active" data-engine="all">All</button>
            <button class="filter-tab" data-engine="1UZ-FE">1UZ-FE</button>
            <button class="filter-tab" data-engine="2JZ-GTE">2JZ-GTE</button>
            <button class="filter-tab" data-engine="K24">K-Series</button>
          </div>
          <div class="filter-sort">
            <label for="sort-select">Sort:</label>
            <select id="sort-select">
              <option value="default">Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name">Name: A-Z</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js"></script>
  <script defer src="components/footer.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="data/products-data.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await SVKProducts.load();
      let engineFilter = 'all';
      let currentSort = 'default';

      function render() {
        const filter = { category: 'other' };
        if (engineFilter !== 'all') filter.engine = engineFilter;
        if (currentSort !== 'default') filter.sort = currentSort;
        SVKProducts.renderProductGrid(SVKProducts.getProducts(filter), 'product-grid');
      }

      document.querySelectorAll('#engine-filter .filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#engine-filter .filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          engineFilter = tab.dataset.engine;
          render();
        });
      });

      document.getElementById('sort-select').addEventListener('change', (e) => {
        currentSort = e.target.value;
        render();
      });

      render();
    });
  </script>
</body>
</html>
