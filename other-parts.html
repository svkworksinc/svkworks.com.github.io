<head>

  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.svkworks.com/" },
      { "@type": "ListItem", "position": 2, "name": "Parts", "item": "https://www.svkworks.com/other-parts.html" }
    ]
  }
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <div class="page-hero">
      <div class="container">
        <div class="breadcrumb" role="navigation" aria-label="breadcrumb">
          <a href="index.html">Home</a><span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span>Parts</span>
        </div>
        <h1>Parts</h1>
        <p>Engine kits, alternator adapters, relay kits, and accessories for Lexus and JDM swap builds.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="filter-bar" style="flex-direction:column;align-items:flex-start;gap:var(--space-sm);">
          <div class="filter-tabs" id="category-filter">
            <button class="filter-tab active" data-cat="all">All Parts</button>
            <button class="filter-tab" data-cat="engine-parts">Engine Parts</button>
          </div>
          <div class="filter-tabs" id="engine-filter">
            <button class="filter-tab active" data-engine="all">All Engines</button>
            <button class="filter-tab" data-engine="1UZ-FE">1UZ-FE</button>
            <button class="filter-tab" data-engine="2JZ-GTE">2JZ-GTE</button>
            <button class="filter-tab" data-engine="K24">K-Series</button>
          </div>
          <div class="filter-sort">
            <label for="sort-select">Sort:</label>
            <select id="sort-select">
              <option value="default">Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name">Name: A-Z</option>
            </select>
          </div>
        </div>
        <div id="parts-empty" class="empty-state" style="display:none;">
          <div class="empty-state-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M20.5 7.3L12 3 3.5 7.3M20.5 7.3L12 11.7M20.5 7.3v9.4L12 21m0-9.3L3.5 7.3M12 11.7v9.3m0-9.3L3.5 16.7m0-9.4v9.4L12 21"/></svg>
          </div>
          <h3>Nothing listed yet</h3>
          <p>Check back soon — we're always adding more parts and accessories.</p>
        </div>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js?v=c947f061"></script>
  <script defer src="components/footer.js?v=a7276d21"></script>
  <script defer src="js/cart.js?v=8cff9968"></script>
  <script defer src="js/components.js?v=e5f86304"></script>
  <script defer src="data/products-data.js?v=3b913be2"></script>
  <script defer src="js/products.js?v=a112a74f"></script>
  <script defer src="js/search.js?v=adfac764"></script>
  <script defer src="js/main.js?v=1bf74b49"></script>
  <script src="js/auth.js?v=f9a5c12a"></script>
  <script src="js/parts-catalog.js?v=8ac0cf30"></script>
  <script>
    let allOtherParts = [];
    let categoryFilter = 'all';
    let engineFilter = 'all';
    let currentSort = 'default';

    function render() {
      let parts = allOtherParts;
      if (categoryFilter !== 'all') parts = parts.filter(p => p.category === categoryFilter);
      if (engineFilter !== 'all') parts = parts.filter(p => p.engine === engineFilter);
      if (currentSort === 'price-asc') parts = [...parts].sort((a, b) => a.price - b.price);
      else if (currentSort === 'price-desc') parts = [...parts].sort((a, b) => b.price - a.price);
      else if (currentSort === 'name') parts = [...parts].sort((a, b) => a.title.localeCompare(b.title));

      const grid = document.getElementById('product-grid');
      const emptyEl = document.getElementById('parts-empty');
      if (!parts.length) {
        grid.style.display = 'none';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = parts.map(part => {
        const img = (part.images && part.images[0]) || 'img/filler.webp';
        const url = svkCatalogPartUrl(part);
        const priceOrBadge = part.status === 'available'
          ? `<span class="product-card-price">${svkFormatCatalogPrice(part.price)}</span>`
          : `<span class="product-card-price" style="color:var(--text-muted);">Coming Soon</span>`;
        return `
        <div class="product-card fade-in">
          <div class="product-card-image">
            <img src="${img}" alt="${part.title}" loading="lazy">
            ${part.status !== 'available' ? '<span class="product-card-badge badge">Coming Soon</span>' : ''}
          </div>
          <div class="product-card-body">
            <h3 class="product-card-title"><a href="${url}">${part.title}</a></h3>
            <p class="product-card-desc">${(part.description || '').slice(0, 110)}${(part.description || '').length > 110 ? '…' : ''}</p>
            <div class="product-card-footer">
              ${priceOrBadge}
              <a href="${url}" class="btn btn-primary btn-sm">View</a>
            </div>
          </div>
        </div>`;
      }).join('');
      if (typeof SVKMain !== 'undefined') SVKMain.observeAnimations();
    }

    document.querySelectorAll('#category-filter .filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#category-filter .filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        categoryFilter = tab.dataset.cat;
        render();
      });
    });

    document.querySelectorAll('#engine-filter .filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#engine-filter .filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        engineFilter = tab.dataset.engine;
        render();
      });
    });

    document.getElementById('sort-select').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    const SVK_STATIC_OTHER_PARTS = [
      {
        id: 'sequoia-alternator-adapter',
        slug: 'sequoia-alternator-adapter',
        title: 'Sequoia / Tundra 2UZ Alternator Adapter Harness for 2JZ & 1UZ',
        description: 'Plug-and-play adapter harness to run a Sequoia or Tundra 2UZ-FE high-output alternator on your 2JZ or 1UZ build. Connects to the stock alternator connector — no cutting, no splicing.',
        images: ['img/alternator1.webp'],
        price: 25,
        status: 'available',
        subcategory: 'other-parts',
      },
      {
        id: '2jz-power-steering-delete',
        slug: '2jz-power-steering-delete',
        title: '2JZ Power Steering Delete Kit',
        description: 'Complete power steering delete kit for 2JZ engines. Includes billet aluminum pulley, spacers, and a new belt. Keeps A/C fully functional. Eliminates the power steering pump and all associated lines.',
        images: ['img/filler.webp'],
        price: 89,
        status: 'coming-soon',
        engine: '2JZ-GTE',
        category: 'engine-parts',
        subcategory: 'other-parts',
      },
      {
        id: '1uz-3uz-power-steering-delete',
        slug: '1uz-3uz-power-steering-delete',
        title: '1UZ / 3UZ Power Steering Delete Kit',
        description: 'Power steering delete kit for 1UZ-FE and 3UZ-FE engines. Replaces the power steering pump with a billet bracket, idler pulley, and mounting hardware. Optional accessory belt available. Fits SC400, SC430, LS400, LS430, GS400, GS430, and swap applications.',
        images: ['img/1UZ%203UZ%20Power%20Steering%20Delete%201.webp'],
        price: 190,
        status: 'available',
        engine: '1UZ-FE',
        category: 'engine-parts',
        subcategory: 'other-parts',
      }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      const urlCat = new URLSearchParams(window.location.search).get('cat');
      if (urlCat) {
        categoryFilter = urlCat;
        document.querySelectorAll('#category-filter .filter-tab').forEach(t => {
          t.classList.toggle('active', t.dataset.cat === urlCat);
        });
      }

      SVKAuth.init();
      await SVKAuth.ready;
      const catalogParts = await SVKAuth.getPartsCatalog('other-parts');
      allOtherParts = [...SVK_STATIC_OTHER_PARTS, ...catalogParts];
      render();
    });
  </script>
</body>
</html>
