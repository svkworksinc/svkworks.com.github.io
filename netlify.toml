[build]
  publish = "."
  # cachebust.js rewrites every shared script/style reference to a content
  # hash of the target file, so a forgotten manual ?v= bump can never again
  # leave a fix invisible to browsers caching /js/* for a year.
  # image-dims.js stamps intrinsic width/height onto every static <img> so
  # the browser can reserve space before the bytes land (Cumulative Layout
  # Shift is a Core Web Vitals ranking factor).
  command = "npm install && node scripts/cachebust.js && node scripts/image-dims.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"

# Asset optimization - minify CSS, JS, HTML and compress images
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Cache static assets aggressively - 1 year for fingerprinted assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML pages - short cache so updates show immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security and performance headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Checkout page: allow Stripe.js and PayPal SDK; block framing (payment page)
[[headers]]
  for = "/checkout*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.paypal.com https://www.sandbox.paypal.com https://fonts.googleapis.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.paypal.com https://www.sandbox.paypal.com; connect-src 'self' https://api.stripe.com https://www.paypal.com https://www.sandbox.paypal.com https://q.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.paypalobjects.com https://t.paypal.com; frame-ancestors 'none'"

# Order confirmation: allow printing, no framing
[[headers]]
  for = "/order-confirmation*"
  [headers.values]
    frame-ancestors = "'none'"

# Clean URLs for the dynamically-generated feeds (Google Merchant Center /
# Google Shopping product feed, and the products sitemap)
[[redirects]]
  from = "/product-feed.xml"
  to = "/.netlify/functions/product-feed"
  status = 200

[[redirects]]
  from = "/sitemap-products.xml"
  to = "/.netlify/functions/sitemap-products"
  status = 200

# Shareable order tracking link (svkworks.com/tracking?t=<token>). Rewritten
# (not redirected) so the /tracking URL and its ?t= query string stay in the
# address bar while track-order.html does the actual token lookup.
[[redirects]]
  from = "/tracking"
  to = "/track-order.html"
  status = 200
