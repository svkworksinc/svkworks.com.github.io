<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Used Parts — SVK Works</title>
  <meta name="description" content="Used and take-off parts from SVK Works — harness components, connectors, and spares at a discount. First come, first served.">
  <link rel="canonical" href="https://www.svkworks.com/used-parts.html">
  <meta property="og:site_name" content="SVK Works">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Used Parts — SVK Works">
  <meta property="og:description" content="Used and take-off parts from SVK Works — harness components, connectors, and spares at a discount.">
  <meta property="og:url" content="https://www.svkworks.com/used-parts.html">
  <meta property="og:image" content="https://www.svkworks.com/img/svk-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Used Parts — SVK Works">
  <meta name="twitter:description" content="Used and take-off parts from SVK Works — harness components, connectors, and spares at a discount.">
  <meta name="twitter:image" content="https://www.svkworks.com/img/svk-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/svk-icon.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.svkworks.com/" },
      { "@type": "ListItem", "position": 2, "name": "Used Parts", "item": "https://www.svkworks.com/used-parts.html" }
    ]
  }
  </script>
</head>
<body>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <div class="page-hero">
      <div class="container">
        <div class="breadcrumb" role="navigation" aria-label="breadcrumb">
          <a href="index.html">Home</a><span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span>Used Parts</span>
        </div>
        <h1>Used Parts</h1>
        <p>Take-offs, spares, and used gear from our own builds — first come, first served. Each listing is one-of-a-kind, so once it's gone, it's gone.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <div class="filter-tabs" id="condition-filter">
            <button class="filter-tab active" data-filter="all">All</button>
          </div>
        </div>

        <div id="parts-loading" class="account-empty">
          <div class="account-empty-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <p>Loading used parts…</p>
        </div>

        <div id="parts-empty" class="empty-state" style="display:none;">
          <div class="empty-state-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M20.5 7.3L12 3 3.5 7.3M20.5 7.3L12 11.7M20.5 7.3v9.4L12 21m0-9.3L3.5 7.3M12 11.7v9.3m0-9.3L3.5 16.7m0-9.4v9.4L12 21"/></svg>
          </div>
          <h3>No used parts listed right now</h3>
          <p>Check back soon — we list take-offs and spares as they come up.</p>
        </div>

        <div class="product-grid" id="parts-grid" style="display:none;"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script defer src="components/header.js?v=1"></script>
  <script defer src="components/footer.js?v=1"></script>
  <script defer src="js/cart.js?v=5"></script>
  <script defer src="js/components.js?v=1"></script>
  <script defer src="data/products-data.js?v=1"></script>
  <script defer src="js/products.js?v=1"></script>
  <script defer src="js/search.js?v=1"></script>
  <script defer src="js/main.js?v=1"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/used-parts.js?v=1"></script>
  <script>
    let allParts = [];

    function renderGrid(parts) {
      const grid = document.getElementById('parts-grid');
      grid.innerHTML = parts.map(part => {
        const img = (part.images && part.images[0]) || 'img/filler.webp';
        return `
        <div class="product-card fade-in" data-filter="${part.condition}">
          <div class="product-card-image">
            <img src="${img}" alt="${part.title}" loading="lazy">
          </div>
          <div class="product-card-body">
            <h3 class="product-card-title">
              <a href="used-part.html?id=${part.id}">${part.title}</a>
            </h3>
            <p class="product-card-desc">${(part.description || '').slice(0, 110)}${(part.description || '').length > 110 ? '…' : ''}</p>
            <div style="margin-bottom:8px;">${svkConditionBadge(part.condition)}</div>
            <div class="product-card-footer">
              <span class="product-card-price">${svkFormatPartPrice(part.price)}</span>
              <a href="used-part.html?id=${part.id}" class="btn btn-primary btn-sm">View</a>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function renderFilterTabs(parts) {
      const conditionsPresent = SVK_CONDITION_ORDER.filter(c => parts.some(p => p.condition === c));
      const tabsEl = document.getElementById('condition-filter');
      tabsEl.innerHTML = '<button class="filter-tab active" data-filter="all">All</button>' +
        conditionsPresent.map(c => `<button class="filter-tab" data-filter="${c}">${svkConditionInfo(c).label}</button>`).join('');

      tabsEl.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          tabsEl.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const filter = tab.dataset.filter;
          document.querySelectorAll('#parts-grid .product-card').forEach(card => {
            card.style.display = (filter === 'all' || card.dataset.filter === filter) ? '' : 'none';
          });
          if (typeof SVKMain !== 'undefined') SVKMain.observeAnimations();
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      SVKAuth.init();
      await SVKAuth.ready;

      allParts = await SVKAuth.getUsedParts();

      document.getElementById('parts-loading').style.display = 'none';

      if (!allParts.length) {
        document.getElementById('parts-empty').style.display = 'block';
        return;
      }

      document.getElementById('parts-grid').style.display = 'grid';
      renderFilterTabs(allParts);
      renderGrid(allParts);
      if (typeof SVKMain !== 'undefined') SVKMain.observeAnimations();
    });
  </script>
</body>
</html>
